[project]
name = "sona-e2e"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
