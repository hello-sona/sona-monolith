[project]
name = "sona-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.1",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.1",
    "google-auth>=2.58.0",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "ruff>=0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"config/test_settings.py" = ["F403", "F405"]
