name: Run frontend, backend and end to end tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/src"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /src --verbose --redact

  frontend:
    name: Run frontend linter and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    name: Run backend linter and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .
      - run: uv run pytest

  e2e:
    name: Run e2e linter and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install backend
        run: uv sync --frozen --group dev
        working-directory: backend
      - name: Install e2e
        run: uv sync --frozen --group dev
        working-directory: e2e
      - name: Lint e2e
        run: uv run ruff check .
        working-directory: e2e
      - name: Install Playwright
        run: uv run playwright install --with-deps chromium
        working-directory: e2e
      - name: Run e2e tests
        run: uv run pytest
        working-directory: e2e
        env:
          DB_ENGINE: sqlite
