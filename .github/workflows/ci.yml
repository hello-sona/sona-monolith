name: Run frontend, backend and end to end tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/src"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          detect --source /src --verbose --redact

  frontend:
    name: Run frontend linter and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  backend:
    name: Run backend linter and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # The pg gem needs libpq headers even though the specs run on SQLite.
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
        working-directory: .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend
      - run: bundle exec rubocop
      - run: bundle exec rspec

  e2e:
    name: Run e2e linter and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install libpq
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: e2e
      # Cuprite drives the Chrome that ships with the runner image.
      - uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      # The suite starts the API itself, so the backend bundle has to exist.
      - name: Install backend gems
        run: bundle install
        working-directory: backend
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/backend/Gemfile
      - name: Lint e2e
        run: bundle exec rubocop
        working-directory: e2e
      - name: Run e2e tests
        run: bundle exec rspec
        working-directory: e2e
        env:
          DB_ENGINE: sqlite
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: e2e/log/
